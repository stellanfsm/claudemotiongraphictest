<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { createRenderer, createPost, slabGeo, panelGeo, chain, T, Ry, Rx, S, latheGeo } from './gl3d.js';
const W = 1080, H = 1920;
const q = new URLSearchParams(location.search);
const g3 = document.createElement('canvas'); g3.width = W; g3.height = H;
const R = createRenderer(g3, { antialias: q.has('aa') });
const img = new Image(); img.src = 'assets/site-skogli.jpg'; await img.decode();
const tex = R.texture(img);
const body = R.mesh(slabGeo(0.78, 1.64, 0.085, 0.13, 0.03));
const screen = R.mesh(panelGeo(0.73, 1.59, 0.105));
const king = R.mesh(latheGeo([[0,0],[.32,0,1],[.32,.06],[.26,.1],[.2,.14],[.14,.5],[.12,.78],[.2,.82,1],[.2,.86],[.1,.9],[.14,1.02],[.08,1.1],[0,1.12]]));
window.run = (t) => {
  const phone = chain(T(0, 0.86, 0), Ry(-0.45 + t*0.3), Rx(-0.08));
  const items = [
    { mesh: body, model: phone, mat: { color: [0.03, 0.03, 0.035], rough: 0.25, metal: 0.9, coat: 0.6 } },
    { mesh: screen, model: chain(phone, T(0, 0, 0.0431)), mat: { mode: 1, texA: tex, rectA: [0, 0.0, 1, 0.38], emit: 1.0, shadow: false } },
    { mesh: king, model: chain(T(0.75, 0, -0.4), S(0.9)), mat: { color: [0.9, 0.04, 0.08], rough: 0.18, coat: 1 } },
  ];
  if (q.has('empty')) items.length = 0;
  if (q.has('unlit')) for (const it of items) it.mat = { ...it.mat, mode: 3, emit: 1, color: [1,0,0] };
  const t0 = performance.now();
  R.render(items, { eye: [0.25, 1.4, 4.5], target: [0.1, 0.7, 0], fov: 0.62 }, {
    floor: q.has('nofloor') ? null : { sq: 0.5, colA: [0.55, 0.55, 0.56], colB: [0.012, 0.012, 0.014], reflA: q.has('norefl') ? 0 : 0.12, reflB: q.has('norefl') ? 0 : 0.45, radius: 9, fade: 1.5 },
    light: { shadow: !q.has('noshadow'), keyDir: [0.5, 0.9, 0.6], shadowCenter: [0, 0.6, 0], shadowSize: 3 },
  });
  const px = new Uint8Array(4); R.gl.readPixels(0,0,1,1,R.gl.RGBA,R.gl.UNSIGNED_BYTE,px);
  const t1 = performance.now();
  return [Math.round(t1 - t0)];
};
window.ready = true;
</script></body></html>
